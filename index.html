<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#26333d"><link rel="manifest" href="manifest.webmanifest"><title>SimuSystem</title>
<style>
:root{--bg:#d9d9d9;--dark:#424c55;--light:#82909a;--ink:#172027;--closed:#ed2024;--open:#159528;--accent:#43807a}*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial;background:#eef1f3;color:var(--ink);overflow:hidden}header{height:62px;background:#26333d;color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;box-shadow:0 2px 10px #0003}.brand{font-size:21px;font-weight:800}.brand small{display:block;font-size:10px;font-weight:500;color:#bdc8cf}.tabs{display:flex;gap:6px;overflow:auto}.tab{border:0;border-radius:8px;padding:10px 15px;background:#4a5964;color:white;font-weight:700;white-space:nowrap}.tab.active{background:var(--accent)}.stats{margin-left:auto;display:flex;gap:7px}.pill{background:#ffffff16;padding:8px 11px;border-radius:18px;font-weight:700;white-space:nowrap}main{height:calc(100vh - 62px);background:var(--bg)}.viewport{width:100%;height:100%;overflow:auto;touch-action:pan-x pan-y}.canvas{min-width:1200px;min-height:760px;width:100%;height:100%}svg{width:100%;height:100%;display:block}.screen{display:none}.screen.active{display:block}.panel{fill:var(--dark)}.panel.light{fill:var(--light)}.bus,.wire{stroke:#111;stroke-width:3;fill:none}.wire{stroke-width:2}.label{font:12px system-ui;fill:var(--ink)}.on-dark{font:12px system-ui;fill:#fff}.title{font:bold 14px system-ui}.voltage{font:bold 12px system-ui;fill:#34444e}.breaker rect{stroke:#111;stroke-width:1;cursor:pointer}.breaker.closed rect{fill:var(--closed)}.breaker.open rect{fill:var(--open)}.breaker text{font:10px system-ui;fill:#111;pointer-events:none}.transformer{fill:none;stroke:#111;stroke-width:2}.controls{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}.fab{border:0;border-radius:50%;width:46px;height:46px;background:#26333d;color:#fff;font-size:21px;box-shadow:0 3px 10px #0005}.legend{position:fixed;left:14px;bottom:14px;background:#fffffff0;padding:9px 12px;border-radius:10px;box-shadow:0 2px 10px #0002}.dot{display:inline-block;width:12px;height:12px;margin:0 4px 0 10px}.dot:first-child{margin-left:0}.red{background:var(--closed)}.green{background:var(--open)}dialog{border:0;border-radius:14px;padding:22px;box-shadow:0 18px 60px #0007;max-width:360px}dialog::backdrop{background:#0008}dialog button{border:0;border-radius:8px;padding:10px 16px;font-weight:700}.primary{background:var(--accent);color:white}
@media(max-width:720px){header{height:108px;align-items:flex-start;padding-top:10px;flex-wrap:wrap}.brand{font-size:16px}.tabs{order:3;width:100%;padding-bottom:8px}.tab{padding:8px 12px}.stats{font-size:11px}main{height:calc(100vh - 108px)}.legend{font-size:11px}}
</style></head><body>
<header><div class="brand">SimuSystem<small>Simulador de Manobras do Sistema Elétrico</small></div><nav class="tabs"><button class="tab active" data-screen="se56a">SE-56A-1</button><button class="tab" data-screen="se56c">SE-56C-1</button><button class="tab" data-screen="geral">GERAL ALUNORTE</button></nav><div class="stats"><span class="pill" id="errors">Erros: 0</span><span class="pill" id="last">Pronto</span></div></header>
<main><div class="viewport"><div class="canvas"><svg id="se56a" class="screen active" viewBox="0 0 1500 800"></svg><svg id="se56c" class="screen" viewBox="0 0 1500 800"></svg><svg id="geral" class="screen" viewBox="0 0 1500 800"></svg></div></div></main>
<div class="legend"><span class="dot red"></span>Fechado <span class="dot green"></span>Aberto</div><div class="controls"><button class="fab" id="reset" title="Reiniciar">↻</button><button class="fab" id="zoomOut">−</button><button class="fab" id="zoomIn">+</button></div>
<dialog id="confirmBox"><h3 id="question"></h3><p id="detail"></p><div style="display:flex;justify-content:flex-end;gap:8px"><button id="cancel">Cancelar</button><button class="primary" id="accept">Confirmar</button></div></dialog>
<script>
const NS="http://www.w3.org/2000/svg",state=JSON.parse(localStorage.getItem("simuState")||"{}");let errors=+(localStorage.getItem("simuErrors")||0),pending=null,scale=1;
const E=(n,a={},t)=>{const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(t!=null)e.textContent=t;return e},line=(s,x1,y1,x2,y2,c="wire")=>s.append(E("line",{x1,y1,x2,y2,class:c})),text=(s,x,y,t,c="label")=>s.append(E("text",{x,y,class:c},t));
function panel(s,x,y,w,h,t,l=false){s.append(E("rect",{x,y,width:w,height:h,class:"panel"+(l?" light":"")}));text(s,x+12,y+22,t,"title on-dark")}
function breaker(s,id,tag,x,y,initial="closed"){if(!state[id])state[id]=initial;const g=E("g",{class:"breaker "+state[id],"data-id":id,"data-tag":tag,tabindex:0,role:"button"});g.append(E("rect",{x,y,width:30,height:30}));g.append(E("text",{x:x+15,y:y-7,"text-anchor":"middle"},tag));g.onclick=()=>ask(id,tag);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" ")ask(id,tag)};s.append(g)}
function tf(s,x,y){s.append(E("circle",{cx:x,cy:y-9,r:14,class:"transformer"}));s.append(E("circle",{cx:x,cy:y+9,r:14,class:"transformer"}))}
function base(s,t){text(s,60,45,t,"title");text(s,1300,45,"By: Jesuíno Neto","title");text(s,60,72,"Diagrama unifilar vetorial • Treinamento","voltage")}
function build56a(){const s=document.querySelector("#se56a");base(s,"SE-56A-1");text(s,100,115,"230 kV","voltage");line(s,180,120,1240,120,"bus");[["CSA-56A-3A",350],["CSA-56A-3B",790],["CSA-56A-3C",1060]].forEach((a,i)=>{breaker(s,"a"+i,a[0],a[1],130);line(s,a[1]+15,160,a[1]+15,260);breaker(s,"a"+(i+3),"DJA-56A-1"+String.fromCharCode(65+i),a[1],175);tf(s,a[1]+15,230)});panel(s,260,285,440,95,"13,8 kV — BARRA A",true);panel(s,720,285,440,95,"13,8 kV — BARRA B",true);line(s,315,330,1100,330,"bus");breaker(s,"a6","DJ-56A-6A",340,315);breaker(s,"a7","DJ-56A-1T",650,315);breaker(s,"a8","DJ-56A-2T",735,315);breaker(s,"a9","DJ-56A-6B",815,315,"open");breaker(s,"a10","DJ-56A-12B",1070,315,"open");text(s,610,270,"CALDEIRA D","title");text(s,925,270,"CALDEIRA E","title");line(s,495,380,495,455);tf(s,495,425);line(s,975,380,975,455);tf(s,975,425);panel(s,290,470,880,105,"MCCM-18A-1");line(s,335,520,1120,520,"bus");["DJ-18A-11","DJ-18A-11A","DJ-18A-12T","DJ-18A-11B","DJ-18A-15B"].forEach((t,i)=>breaker(s,"a"+(11+i),t,360+i*175,505,i===2?"open":"closed"));text(s,520,555,"49 A","voltage");text(s,940,555,"49 A","voltage");text(s,720,455,"4,16 kV","voltage");panel(s,240,625,500,100,"BCCM-18A-1");panel(s,780,625,420,100,"MCCM-28A-1");line(s,285,680,695,680,"bus");line(s,825,680,1155,680,"bus");[["DJ-18A-110A",300],["DJ-18A-120T",430],["DJ-18A-130T",570],["DJ-18A-110B",680],["DJ-28A-11T",830],["DJ-28A-12T",970],["DJ-28A-11B",1120]].forEach((a,i)=>breaker(s,"a"+(16+i),a[0],a[1],665,i===1||i===5?"open":"closed"));text(s,300,715,"90 A","on-dark");text(s,655,715,"90 A","on-dark");text(s,725,610,"480 V","voltage")}
function build56c(){const s=document.querySelector("#se56c");base(s,"SE-56C-1");text(s,100,110,"230 kV","voltage");line(s,145,115,1250,115,"bus");panel(s,120,245,1210,165,"PÁTIO 230 kV");line(s,150,340,1295,340,"bus");text(s,145,320,"BARRA A","on-dark");text(s,1210,320,"BARRA B","on-dark");[["CSA-56C-1A",520,250],["DJA-56C-1A",520,290],["CSA-56C-1B",520,330],["CSA-56C-2A",805,250],["DJA-56C-1B",805,290],["CSA-56C-2B",805,330],["CSA-56C-3A",970,345],["DJA-56C-1A",970,380],["CSA-56C-3B",1140,345],["DJA-56C-1B",1140,380],["CSA-56C-3C",1250,345],["DJA-56C-1C",1250,380]].forEach((a,i)=>breaker(s,"c"+i,a[0],a[1],a[2]));[985,1155,1265].forEach(x=>{line(s,x,410,x,500);tf(s,x,455)});panel(s,820,515,510,160,"PML-56C-1");line(s,845,565,1300,565,"bus");["DJA-56C-6A","DJA-56C-1T","DJA-56C-2T","DJA-56C-6B","DJA-56C-12B"].forEach((t,i)=>breaker(s,"c"+(12+i),t,850+i*105,550,i>2?"open":"closed"));panel(s,120,500,610,185,"DISTRIBUIÇÃO 13,8 kV",true);line(s,145,555,695,555,"bus");["DJ-56A-12","DJ-56A-13","DJ-56A-14","DJ-56A-15","DJ-56A-16","DJ-56A-17","DJ-56A-18","DJ-56A-19"].forEach((t,i)=>breaker(s,"c"+(17+i),t,145+i*72,540,i%2===0?"open":"closed"))}
function buildGeral(){const s=document.querySelector("#geral");base(s,"GERAL ALUNORTE");text(s,100,100,"230 kV","voltage");line(s,160,105,1240,105,"bus");panel(s,145,245,1160,115,"PML-56C-1",true);line(s,195,300,1250,300,"bus");text(s,175,282,"BARRA A","on-dark");text(s,1190,282,"BARRA B","on-dark");[["DJA-56C-10A",210],["DJA-56C-4",310],["DJA-56C-8A",510],["DJA-56C-5",715],["DJA-56C-8B",865],["DJA-56C-6",1090]].forEach((a,i)=>breaker(s,"g"+i,a[0],a[1],285));panel(s,360,390,350,95,"AQF-87D-2");line(s,395,445,675,445,"bus");breaker(s,"g6","DJ-87D-50",445,430);breaker(s,"g7","DJ-87D-52",550,430,"open");breaker(s,"g8","DJ-87D-51",650,430);panel(s,745,390,360,95,"AQF-57C-1");line(s,780,445,1070,445,"bus");breaker(s,"g9","DJ-57C-6",790,430);breaker(s,"g10","DJ-57C-11",900,430,"open");breaker(s,"g11","DJ-57C-16",1020,430);[["TG-2",825],["TG-3",940],["TG-1",1055]].forEach(a=>{line(s,a[1],390,a[1],350);s.append(E("circle",{cx:a[1],cy:375,r:17,class:"transformer"}));text(s,a[1]-15,380,a[0])});panel(s,350,550,760,125,"ALIMENTADORES 13,8 kV");line(s,390,610,1070,610,"bus");["02A","05A","11A","12A","01A","02B","05B","11B","12B","01B"].forEach((t,i)=>breaker(s,"g"+(12+i),t,390+i*70,595))}
function ask(id,tag){pending={id,tag};const action=state[id]==="closed"?"abrir":"fechar";document.querySelector("#question").textContent="Deseja "+action+" o equipamento?";document.querySelector("#detail").textContent=tag;document.querySelector("#confirmBox").showModal()}
const forbidden=[["a0","a3"],["a1","a4"],["a2","a5"],["a7","a8"],["a16","a17"],["a17","a18"],["a20","a21"],["c0","c1"],["c3","c4"],["c12","c13"],["c15","c16"],["g6","g8"],["g9","g11"]];
function wrong(id,next){return next==="closed"&&forbidden.some(p=>p.includes(id)&&state[p.find(x=>x!==id)]==="closed")}
function commit(){if(!pending)return;const next=state[pending.id]==="closed"?"open":"closed";state[pending.id]=next;if(wrong(pending.id,next)){errors++;localStorage.setItem("simuErrors",errors);document.querySelector("#errors").textContent="Erros: "+errors;document.querySelector("#last").textContent="MANOBRA ERRADA";alert("MANOBRA ERRADA! Verifique o intertravamento.")}else document.querySelector("#last").textContent=pending.tag+" "+(next==="closed"?"fechado":"aberto");localStorage.setItem("simuState",JSON.stringify(state));document.querySelector('[data-id="'+pending.id+'"]').setAttribute("class","breaker "+next);pending=null;document.querySelector("#confirmBox").close()}
build56a();build56c();buildGeral();document.querySelector("#errors").textContent="Erros: "+errors;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.screen").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector("#"+b.dataset.screen).classList.add("active")});document.querySelector("#accept").onclick=commit;document.querySelector("#cancel").onclick=()=>{pending=null;document.querySelector("#confirmBox").close()};document.querySelector("#reset").onclick=()=>{if(confirm("Reiniciar estados e contador?")){localStorage.clear();location.reload()}};document.querySelector("#zoomIn").onclick=()=>{scale=Math.min(2,scale+.15);document.querySelector(".canvas").style.width=100*scale+"%"};document.querySelector("#zoomOut").onclick=()=>{scale=Math.max(.7,scale-.15);document.querySelector(".canvas").style.width=100*scale+"%"};if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
